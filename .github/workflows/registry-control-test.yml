name: Registry control test
on:
  workflow_dispatch:
    inputs:
      docker_source:
        description: Where the fixed job pulls its image from
        type: choice
        options: [dockerhub, ecr]
        default: dockerhub
      run_stale:
        description: Run the stale-dirty job
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@rc-20-int
        with:
          egress-policy: audit
      - run: curl -sS -o /dev/null https://api.github.com

  always-public:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@rc-20-int
        with:
          egress-policy: audit
      - run: curl -sS -o /dev/null https://registry.npmjs.org/

  fixed:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@rc-20-int
        with:
          egress-policy: audit
      - if: inputs.docker_source == 'dockerhub'
        run: docker pull alpine:3.20
      - if: inputs.docker_source == 'ecr'
        run: docker pull public.ecr.aws/docker/library/alpine:3.20

  stale-dirty:
    if: inputs.run_stale
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@rc-20-int
        with:
          egress-policy: audit
      - run: docker pull alpine:3.20
